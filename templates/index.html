<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Health Assessment</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #242424;
            padding: 30px;
            border-radius: 8px;
            width: 350px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
        }
        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background: #333333;
            border: 1px solid #444444;
            color: #ffffff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .result-box {
            margin-top: 20px;
            padding: 12px;
            background-color: #332222;
            border: 1px solid #553333;
            border-radius: 4px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: #ffcccc;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>AI Health Assessment</h2>
        
        <!-- Form එක හරහා දත්ත /predict වෙත යවයි -->
        <form action="/predict" method="POST">
            <label>Weight (kg):</label>
            <input type="number" step="any" name="weight" required>
            
            <label>Height (meters):</label>
            <input type="number" step="any" name="height" required>
            
            <label>Age (years):</label>
            <input type="number" name="age" required>
            
            <button type="submit">Predict Risk</button>
        </form>

        <!-- Python backend එකෙන් එවන prediction_text මෙහි පෙන්වයි -->
        {% if prediction_text %}
        <div class="result-box">
            {{ prediction_text }}
        </div>
        {% endif %}
    </div>

</body>
</html>
